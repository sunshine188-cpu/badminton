<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽毛球装备库</title>
<style>
  :root{
    --bg:#eef6fc;
    --card:#ffffff;
    --accent:#3f8fdd;
    --accent-dark:#2f6fb8;
    --accent-light:#e6f1fb;
    --text:#2b3a4a;
    --muted:#8a9aa9;
    --border:#d7e7f4;
    --shadow:0 2px 10px rgba(63,143,221,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;padding:0 0 40px;
    -webkit-tap-highlight-color:transparent;
  }
  .container{max-width:1080px;margin:0 auto;padding:0 16px;}
  header{text-align:center;padding:36px 16px 8px;}
  header h1{font-size:28px;color:var(--accent-dark);letter-spacing:1px;}
  header p{color:var(--muted);margin-top:6px;font-size:14px;}
  .tabs{display:flex;justify-content:center;gap:10px;margin:22px 0 6px;flex-wrap:wrap;}
  .tab{
    border:1px solid var(--border);background:#fff;color:var(--muted);
    padding:10px 26px;border-radius:999px;cursor:pointer;font-size:15px;
    transition:.2s;box-shadow:var(--shadow);user-select:none;
  }
  .tab:hover{border-color:var(--accent);color:var(--accent-dark);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .panel{display:none;margin-top:18px;}
  .panel.active{display:block;}
  .filters{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);
  }
  .filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .filters select{
    border:1px solid var(--border);border-radius:8px;padding:7px 10px;
    font-size:14px;color:var(--text);background:#fbfdff;outline:none;cursor:pointer;
  }
  .filters select:focus{border-color:var(--accent);}
  .count{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 18px 16px;box-shadow:var(--shadow);transition:.2s;
  }
  .card:hover{box-shadow:0 6px 18px rgba(63,143,221,.16);transform:translateY(-2px);}
  .card-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .brand{font-size:12px;color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:6px;}
  .model{font-size:17px;font-weight:700;color:var(--text);}
  .price{font-size:17px;font-weight:800;color:#e0563c;margin-left:auto;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .tag{font-size:12px;color:var(--accent-dark);background:var(--accent-light);padding:3px 9px;border-radius:999px;}
  .style-line{font-size:13px;color:var(--accent-dark);margin-bottom:6px;}
  .desc{font-size:13.5px;line-height:1.7;color:#4a5b6b;}
  .rec-form{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:22px;box-shadow:var(--shadow);max-width:720px;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;column-gap:16px;
  }
  .rec-form h2{font-size:18px;color:var(--accent-dark);margin-bottom:16px;text-align:center;grid-column:1/-1;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field select,.field input{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;
    font-size:15px;background:#fbfdff;outline:none;color:var(--text);
  }
  .field select:focus,.field input:focus{border-color:var(--accent);}
  .field input[type=number]::-webkit-outer-spin-button,
  .field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .field input[type=number]{-moz-appearance:textfield;appearance:textfield;}
  .btn{
    grid-column:1/-1;width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px;font-size:16px;cursor:pointer;transition:.2s;letter-spacing:2px;
  }
  .btn:hover{background:var(--accent-dark);}
  .rec-result{margin-top:20px;}
  .rec-title{font-size:15px;color:var(--accent-dark);text-align:center;margin-bottom:12px;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;line-height:1.8;}

  /* ===== 手机端适配 ===== */
  @media (max-width:640px){
    header{padding:24px 12px 4px;}
    header h1{font-size:22px;}
    header p{font-size:13px;}
    .container{padding:0 12px;}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px;}
    .tab{padding:12px 0;text-align:center;border-radius:12px;font-size:15px;}
    .filters{flex-direction:column;gap:10px;padding:14px;}
    .filters label{width:100%;justify-content:space-between;font-size:14px;}
    .filters select{flex:1;min-height:42px;font-size:16px;}
    .grid{grid-template-columns:1fr;gap:12px;}
    .card{padding:15px 15px 13px;}
    .model{font-size:16px;}
    .price{font-size:16px;}
    .desc{font-size:13px;}
    .rec-form{grid-template-columns:1fr;padding:18px 16px;}
    .field select,.field input{font-size:16px;min-height:44px;}
    .btn{min-height:46px;font-size:16px;}
    .rec-title{font-size:14px;}
  }
</style>
</head>

  <footer>价格均为市场参考价，实际以购买渠道为准。<br>纯文字卡片 · 无图片 · 数据会持续更新</footer>
</div>

function applyRacketFilter(){
  const brand=document.getElementById('r-brand').value;
  const type=document.getElementById('r-type').value;
  const level=document.getElementById('r-level').value;
  const price=document.getElementById('r-price').value;
  const list=rackets.filter(r=>{
    if(brand!=='全部' && r.brand!==brand) return false;
    if(type!=='全部' && r.type!==type) return false;
    if(level!=='全部' && r.level!=='全水平' && !r.level.includes(level)) return false;
    if(price==='p1' && r.price>300) return false;
    if(price==='p2' && (r.price<=300||r.price>600)) return false;
    if(price==='p3' && (r.price<=600||r.price>1200)) return false;
    if(price==='p4' && r.price<=1200) return false;
    return true;
  });
  document.getElementById('r-grid').innerHTML=list.map(racketCard).join('')||'<div class="empty">没有符合条件的球拍</div>';
  document.getElementById('r-count').textContent='共 '+list.length+' 款球拍（合计 '+rackets.length+' 款）';
}

const lv={新手:1,进阶:2,高手:3};
function levelScore(itemLevel,want){
  if(itemLevel==='全水平') return 2;
  if(itemLevel.includes(want)) return 3;
  let best=0;
  itemLevel.split('/').forEach(p=>{
    const diff=Math.abs((lv[p]||2)-(lv[want]||2));
    if(diff===0) best=Math.max(best,3);
    else if(diff===1) best=Math.max(best,1);
  });
  return best;
}
function budgetScore(price,budget){
  if(price<=budget) return 4;
  if(price<=budget*1.2) return 1;
  return 0;
}
function footScore(foot,want){
  if(want==='无所谓') return 0;
  return foot===want?3:0;
}
function isHeadHeavy(r){ return r.balance==='头重' || r.balance==='适中偏头重'; }
function isHeadLight(r){ return r.balance==='头轻'; }
function isLightWeight(r){ return r.weight.indexOf('5U')>=0; }

function updateStyleOptions(){
  const kind=document.getElementById('rec-kind').value;

  if(kind==='球拍'){
    document.getElementById('rec-style').innerHTML='<option>进攻型</option><option>速度型</option><option>均衡型</option>';
    label.textContent='打法风格';
  }else{
    document.getElementById('rec-style').innerHTML='<option>速度型</option><option>稳定型</option><option>全能型</option>';
    label.textContent='鞋型偏好';
  }
  document.getElementById('rec-foot-wrap').style.display = kind==='球鞋' ? 'block' : 'none';
}

function showRecommend(){
  const kind=document.getElementById('rec-kind').value;
  const level=document.getElementById('rec-level').value;
  const style=document.getElementById('rec-style').value;
  const gender=document.getElementById('rec-gender').value;
  const age=parseFloat(document.getElementById('rec-age').value)||25;
  const height=parseFloat(document.getElementById('rec-height').value)||170;
  const weight=parseFloat(document.getElementById('rec-weight').value)||60;
  const strength=document.getElementById('rec-strength').value;
  const injury=document.getElementById('rec-injury').value;
  const budget=parseFloat(document.getElementById('rec-budget').value)||800;
  const foot=document.getElementById('rec-foot').value;

  const pool= kind==='球拍'?rackets:shoesData;

  const bodyWeak = strength==='偏小' || height<160 || weight<50;
  const bodyStrong = strength==='较大' || height>=180 || weight>=80;
  const senior = age>=50;

  const scored=pool.map(item=>{
    let s=budgetScore(item.price,budget);
    s+=levelScore(item.level,level);
    if(item.type===style) s+=3;

    if(kind==='球拍'){
      if(bodyWeak){
        if(isHeadHeavy(item)) s-=2;
        if(isHeadLight(item)||isLightWeight(item)) s+=2;
      }
      if(bodyStrong){
        if(isHeadHeavy(item)||item.type==='进攻型') s+=2;
      }
      if(injury.indexOf('手腕')>=0){
        if(isHeadHeavy(item)) s-=3;
        if(isHeadLight(item)||item.balance==='适中') s+=2;
        if(item.type==='进攻型') s-=1;
      }
      if(senior){
        if(isLightWeight(item)||isHeadLight(item)) s+=1;
        if(isHeadHeavy(item)) s-=1;
      }
      if(gender==='女' && (isLightWeight(item)||isHeadLight(item))) s+=1;
    }

    if(kind==='球鞋'){
      s+=footScore(item.foot,foot);
      if(injury.indexOf('膝盖')>=0 || weight>=80 || senior){
        if(item.type==='稳定型') s+=3;
        else if(item.type==='全能型') s+=1;
        else if(item.type==='速度型') s-=2;
      }
      if(injury==='无伤病' && weight<65 && !senior){
        if(item.type==='速度型') s+=1;
      }
    }

    if(level==='新手' && item.price<=budget) s+=1;
    return {item,score:s};
  });

  scored.sort((a,b)=>b.score-a.score);
  const top=scored.slice(0,5);
  const label= kind==='球拍'?'球拍':'球鞋';

  let extra='';
  if(kind==='球鞋' && foot!=='无所谓') extra+=' · 脚型：'+foot;
  if(injury!=='无伤病') extra+=' · 伤病：'+injury;

  const cards= top.map(t=> kind==='球拍'?racketCard(t.item):shoeCard(t.item)).join('');
  document.getElementById('rec-result').innerHTML=
    '<div class="rec-title">为你推荐以下 5 款'+label+'（水平：'+level+' · 风格：'+style+' · 预算：¥'+budget+extra+'）</div>'+
    '<div class="grid">'+cards+'</div>';
}

// 标签切换
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  });
});

// 筛选事件
['r-brand','r-type','r-level','r-price'].forEach(id=>{
  document.getElementById(id).addEventListener('change',applyRacketFilter);
});
['s-brand','s-type','s-foot','s-level','s-price'].forEach(id=>{
  document.getElementById(id).addEventListener('change',applyShoeFilter);
});

// 推荐事件
document.getElementById('rec-kind').addEventListener('change',updateStyleOptions);
document.getElementById('rec-btn').addEventListener('click',showRecommend);

// 初始化
updateStyleOptions();
applyRacketFilter();
applyShoeFilter();
</script>
</body>
</html>
