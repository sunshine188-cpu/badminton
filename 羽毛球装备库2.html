<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽球装备库 · 球拍与球鞋查阅推荐</title>
<style>
  :root{
    --bg:#eef6fc; --card:#ffffff; --accent:#3f8fdd; --accent-dark:#2f6fb8;
    --text:#2b3a4a; --muted:#6b8299; --border:#d9e8f4; --light:#eaf4fb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  header{
    background:linear-gradient(135deg,#cfe8fb 0%,#eaf4fb 60%,#dceefc 100%);
    padding:36px 20px 28px; text-align:center; border-bottom:1px solid var(--border);
  }
  header h1{font-size:28px; color:var(--accent-dark); letter-spacing:2px;}
  header p{color:var(--muted); margin-top:6px; font-size:14px;}
  .tabs{
    display:flex; justify-content:center; flex-wrap:wrap; gap:10px;
    margin:20px 0 6px; padding:0 16px;
  }
  .tabs button{
    border:1px solid var(--border); background:#fff; color:var(--muted);
    padding:9px 20px; border-radius:999px; cursor:pointer; font-size:15px;
    transition:all .15s;
  }
  .tabs button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tabs button:hover{border-color:var(--accent); color:var(--accent-dark);}
  main{max-width:1080px; margin:0 auto; padding:10px 20px 40px;}
  .section{display:none;}
  .section.active{display:block;}

  .filter-bar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:20px;
  }
  .filter-bar label{font-size:14px; color:var(--muted);}
  .filter-bar select, .filter-bar input{
    padding:7px 10px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; color:var(--text); background:#fff;
  }
  .filter-bar input{flex:1; min-width:140px;}
  .type-btns{display:flex; flex-wrap:wrap; gap:8px;}
  .type-btns button{
    border:1px solid var(--border); background:#f7fbfe; color:var(--muted);
    padding:6px 14px; border-radius:999px; cursor:pointer; font-size:13px;
  }
  .type-btns button.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 2px 8px rgba(63,143,221,.08); transition:transform .15s;
    padding:14px 14px 16px; display:flex; flex-direction:column;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 6px 16px rgba(63,143,221,.16);}
  .brand{font-size:12px; color:var(--muted);}
  .model{font-size:17px; font-weight:700; margin:2px 0 4px;}
  .price{color:var(--accent-dark); font-weight:700; font-size:16px;}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0;}
  .tag{
    font-size:11px; padding:2px 9px; border-radius:999px; background:var(--light);
    color:var(--accent-dark); border:1px solid var(--border);
  }
  .tag.t0{background:#e3f0fb;}
  .style{font-size:13px; color:var(--muted);}
  .desc{
    font-size:12px; color:#5b7690; margin-top:8px; line-height:1.55;
    background:var(--light); border-radius:8px; padding:8px 10px;
  }

  .panel{
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:20px;
  }
  .panel h2{font-size:19px; color:var(--accent-dark); margin-bottom:6px;}
  .panel .sub{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .form-row{display:flex; flex-wrap:wrap; gap:16px; margin-bottom:14px;}
  .form-item{display:flex; flex-direction:column; min-width:150px; flex:1;}
  .form-item label{font-size:13px; color:var(--muted); margin-bottom:4px;}
  .form-item select, .form-item input{
    padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;
  }
  .btn{
    background:var(--accent); color:#fff; border:none; padding:11px 26px;
    border-radius:999px; font-size:15px; cursor:pointer; margin-top:6px;
  }
  .btn:hover{background:var(--accent-dark);}
  .btn.ghost{background:#fff; color:var(--accent-dark); border:1px solid var(--accent);}
  .rec-group{margin-top:26px;}
  .rec-group h3{font-size:16px; color:var(--accent-dark); margin-bottom:12px;
    border-left:4px solid var(--accent); padding-left:10px;}
  .rank{display:inline-block; background:var(--accent); color:#fff; border-radius:8px;
    padding:2px 9px; font-size:12px; margin-bottom:8px;}
  .reason{font-size:13px; color:var(--muted); margin-top:6px;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:20px;}
</style>
</head>

<header>

  </section>

  <!-- 球鞋 -->
  <section id="shoes" class="section">
    <div class="filter-bar">
      <label>品牌</label>
      <select id="s-brand"></select>
      <label>价格</label>
      <select id="s-price">
        <option value="all">全部</option>
        <option value="0-500">¥500 以下</option>
        <option value="500-800">¥500–800</option>
        <option value="800-1200">¥800–1200</option>

      <input id="s-kw" type="text" placeholder="🔍 搜索品牌 / 型号">
    </div>
    <div class="filter-bar type-btns" id="s-types">

      <button data-v="速度">速度鞋</button>
      <button data-v="缓震">缓震鞋</button>
      <button data-v="全面">全面鞋</button>
    </div>
    <div class="grid" id="s-grid"></div>
  </section>

  <!-- 推荐 -->
  <section id="recommend" class="section">
    <div class="panel">
      <h2>🎯 智能推荐</h2>
      <p class="sub">填好下面的个人信息，我帮你挑出更合适的球拍和球鞋（数据仅本地计算，不会上传）。</p>
      <div class="form-row">
        <div class="form-item"><label>技术水平</label>
          <select id="q-level"><option>新手</option><option>进阶</option><option>高手</option></select></div>
        <div class="form-item"><label>打法风格</label>

      </div>
      <div class="form-row">

        <div class="form-item"><label>体重（kg）</label><input id="q-weight" type="number" placeholder="如 65"></div>
        <div class="form-item"><label>力量大小</label>

      <div class="form-row">

        <div class="form-item"><label>膝盖伤病</label>

        <div class="form-item"><label>性别</label>
          <select id="q-gender"><option>男</option><option>女</option></select></div>
      </div>
      <button class="btn" id="q-submit">开始推荐</button>
      <button class="btn ghost" id="q-reset">重置</button>
      <div id="q-result"></div>
    </div>
  </section>
</main>

<footer>数据为市场参考价，仅供参考 · 本页面可离线使用，无需联网</footer>

// ============ 工具 ============
const $ = id => document.getElementById(id);
function uniqueBrands(list){ return [...new Set(list.map(i=>i.brand))]; }
function money(n){ return '¥' + n.toLocaleString('zh-CN'); }

function inPrice(price, range){
  if(range==='all') return true;
  if(range==='0-500') return price<=500;
  if(range==='500-800') return price>500 && price<=800;
  if(range==='800-1200') return price>800 && price<=1200;
  if(range==='1200+') return price>1200;
  return true;
}

// ============ 卡片渲染 ============
function cardHTML(item, kind){
  const tags = kind==='racket'
    ? [`<span class="tag t0">${item.type}</span>`,`<span class="tag">${item.weight}</span>`,`<span class="tag">${item.balance}</span>`]
    : [`<span class="tag t0">${item.type}</span>`];
  return `
    <div class="card">
      <div class="brand">${item.brand}</div>
      <div class="model">${item.model}</div>
      <div class="price">${money(item.price)}</div>
      <div class="tags">${tags.join('')}</div>
      <div class="style">适合：${item.style} · ${item.level}</div>
      <div class="desc">💬 ${item.desc}</div>
    </div>`;
}

function renderGrid(id, items, kind){
  $(id).innerHTML = items.length
    ? items.map(i=>cardHTML(i, kind)).join('')
    : '<p style="color:#6b8299;">没有找到符合条件的装备，试试放宽筛选条件吧。</p>';
}

// ============ 筛选 ============
const rFilter = {brand:'all', price:'all', type:'all', kw:''};
const sFilter = {brand:'all', price:'all', type:'all', kw:''};

function applyRacketFilter(){
  const kw = rFilter.kw.toLowerCase();
  const list = rackets.filter(r =>
    (rFilter.brand==='all' || r.brand===rFilter.brand) &&
    (rFilter.type==='all' || r.type===rFilter.type) &&
    inPrice(r.price, rFilter.price) &&
    (kw==='' || (r.brand+r.model+r.style).toLowerCase().includes(kw))
  );
  renderGrid('r-grid', list, 'racket');
}
function applyShoeFilter(){
  const kw = sFilter.kw.toLowerCase();
  const list = shoesData.filter(s =>
    (sFilter.brand==='all' || s.brand===sFilter.brand) &&
    (sFilter.type==='all' || s.type===sFilter.type) &&
    inPrice(s.price, sFilter.price) &&
    (kw==='' || (s.brand+s.model+s.style).toLowerCase().includes(kw))
  );
  renderGrid('s-grid', list, 'shoe');
}

function fillBrands(){
  const rb = $('r-brand'), sb = $('s-brand');
  let rOpt = '<option value="all">全部</option>';
  uniqueBrands(rackets).forEach(b=> rOpt += `<option>${b}</option>`);
  rb.innerHTML = rOpt;
  let sOpt = '<option value="all">全部</option>';
  uniqueBrands(shoesData).forEach(b=> sOpt += `<option>${b}</option>`);
  sb.innerHTML = sOpt;
}

function bindTypeBtns(containerId, filterObj, apply){
  document.querySelectorAll(`#${containerId} button`).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll(`#${containerId} button`).forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      filterObj.type = btn.dataset.v;
      apply();
    });
  });
}

// ============ 推荐逻辑 ============
function recommend(p){
  const bmi = p.height>0 ? p.weight / Math.pow(p.height/100, 2) : 0;
  const heavy = p.weight>=80 || bmi>=25;

  function racketScore(r){
    let s = 50;
    const st = p.style;
    if(st==='进攻为主') s += r.type==='进攻'?28 : r.type==='平衡'?16 : 8;
    else if(st==='拉吊防守') s += (r.type==='防守'||r.type==='平衡')?24 : 8;
    else if(st==='平衡控制') s += r.type==='平衡'?28 : r.type==='防守'?16 : 10;
    else if(st==='双打快节奏') s += (r.type==='防守'||r.type==='平衡')?24 : 14;
    else s += 14;
    if(p.level==='新手'){ s += r.weight==='5U'?18 : r.weight==='4U'?12 : 0; s += r.balance==='头轻'?12 : r.balance==='均衡'?8 : -4; }
    else if(p.level==='进阶'){ s += r.weight==='4U'?10 : r.weight==='5U'?8 : 6; }
    else { s += r.balance==='头重'?10 : 6; }
    if(p.strength==='力量偏小'){ s += r.balance==='头轻'?14 : r.balance==='均衡'?8 : -6; s += r.weight==='5U'?8:0; }
    else if(p.strength==='力量偏大'){ s += r.balance==='头重'?12 : 4; }
    else { s += 6; }
    if(p.wrist==='有'){ s += r.balance==='头重'?-20 : r.balance==='头轻'?12 : 6; }
    if(p.gender==='女'){ s += r.weight==='5U'?8 : r.weight==='4U'?4 : -2; s += r.balance==='头轻'?6:0; }
    if(heavy) s += r.balance==='头重'?-4 : 2;
    if(p.budget>0 && r.price>p.budget) s -= 40;
    return s;
  }

  function shoeScore(sh){
    let s = 50;
    const st = p.style;
    if(st==='双打快节奏') s += sh.type==='速度'?22 : sh.type==='全面'?18 : 12;
    else if(st==='进攻为主') s += (sh.type==='缓震'||sh.type==='全面')?18 : 12;
    else if(st==='拉吊防守') s += sh.type==='缓震'?22 : sh.type==='全面'?18 : 10;
    else s += sh.type==='全面'?20 : 14;
    if(p.knee==='有') s += sh.type==='缓震'?24 : sh.type==='全面'?14 : -10;
    if(heavy) s += sh.type==='缓震'?16 : sh.type==='全面'?10 : -6;
    if(p.level==='新手') s += (sh.type==='缓震'||sh.type==='全面')?14 : 4;
    if(p.gender==='女') s += 4;
    if(p.budget>0 && sh.price>p.budget) s -= 40;
    return s;
  }

  const racks = rackets.map(r=>({...r, score:racketScore(r)})).sort((a,b)=>b.score-a.score).slice(0,3);
  const shoos = shoesData.map(sh=>({...sh, score:shoeScore(sh)})).sort((a,b)=>b.score-a.score).slice(0,3);
  return {racks, shoos, p};
}

function racketReason(r, p){
  const notes=[r.desc];
  if(p.style==='进攻为主' && r.type==='进攻') notes.push('契合你的进攻打法');
  if(p.style==='拉吊防守' && r.type!=='进攻') notes.push('适合拉吊控制');
  if(p.style==='双打快节奏' && r.type!=='进攻') notes.push('适合双打节奏');
  if(p.level==='新手' && (r.weight==='5U' || r.balance!=='头重')) notes.push('对新手友好');
  if(p.strength==='力量偏小' && r.balance!=='头重') notes.push('挥拍省力');
  if(p.wrist==='有') notes.push(r.balance==='头重' ? '手腕有伤需谨慎' : '减轻手腕负担');
  if(p.gender==='女' && r.weight!=='3U') notes.push('适合女性');
  if(p.budget>0 && r.price>p.budget) notes.push('略超预算，可作升级备选');
  else notes.push('在预算范围内');
  return notes.slice(0,3).join('；');
}
function shoeReason(sh, p){
  const notes=[sh.desc];
  if(p.knee==='有') notes.push(sh.type==='缓震' ? '缓震设计，减轻膝盖压力' : '膝盖有伤建议优先缓震鞋');
  if(p.style==='双打快节奏' && sh.type==='速度') notes.push('适合双打快节奏');
  if(p.level==='新手' && sh.type!=='速度') notes.push('保护性好，适合入门');
  if(p.budget>0 && sh.price>p.budget) notes.push('略超预算，可作升级备选');
  else notes.push('在预算范围内');
  return notes.slice(0,3).join('；');
}

function showRecommend(){
  const p = {
    level: $('q-level').value,
    style: $('q-style').value,
    budget: parseInt($('q-budget').value, 10),
    height: parseFloat($('q-height').value) || 0,
    weight: parseFloat($('q-weight').value) || 0,
    strength: $('q-strength').value,
    wrist: $('q-wrist').value,
    knee: $('q-knee').value,
    gender: $('q-gender').value,
  };
  const {racks, shoos} = recommend(p);
  const rackCards = racks.map((r,i)=>`
    <div class="card" style="margin-bottom:16px;">
      <span class="rank">TOP ${i+1}</span>
      <div class="brand">${r.brand}</div>
      <div class="model">${r.model}</div>
      <div class="price">${money(r.price)}</div>
      <div class="tags">${[`<span class="tag t0">${r.type}</span>`,`<span class="tag">${r.weight}</span>`,`<span class="tag">${r.balance}</span>`].join('')}</div>
      <div class="reason">💡 ${racketReason(r,p)}</div>
    </div>`).join('');
  const shoeCards = shoos.map((s,i)=>`
    <div class="card" style="margin-bottom:16px;">
      <span class="rank">TOP ${i+1}</span>
      <div class="brand">${s.brand}</div>
      <div class="model">${s.model}</div>
      <div class="price">${money(s.price)}</div>
      <div class="tags"><span class="tag t0">${s.type}</span></div>
      <div class="reason">💡 ${shoeReason(s,p)}</div>
    </div>`).join('');

  $('q-result').innerHTML = `
    <div class="rec-group">
      <h3>为你推荐的羽毛球拍</h3>
      <div class="grid">${rackCards}</div>
    </div>
    <div class="rec-group">
      <h3>为你推荐的羽毛球鞋</h3>
      <div class="grid">${shoeCards}</div>
    </div>
    <p style="color:#6b8299;font-size:12px;margin-top:10px;">* 推荐结果为简单规则筛选，仅供参考，购买前建议到实体店试打/试穿。</p>`;
  $('q-result').scrollIntoView({behavior:'smooth'});
}

// ============ Tab 切换 ============
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    $(btn.dataset.tab).classList.add('active');
  });
});

// ============ 事件绑定 ============
$('r-brand').addEventListener('change', e=>{ rFilter.brand=e.target.value; applyRacketFilter(); });
$('r-price').addEventListener('change', e=>{ rFilter.price=e.target.value; applyRacketFilter(); });
$('r-kw').addEventListener('input', e=>{ rFilter.kw=e.target.value; applyRacketFilter(); });
$('s-brand').addEventListener('change', e=>{ sFilter.brand=e.target.value; applyShoeFilter(); });
$('s-price').addEventListener('change', e=>{ sFilter.price=e.target.value; applyShoeFilter(); });
$('s-kw').addEventListener('input', e=>{ sFilter.kw=e.target.value; applyShoeFilter(); });
$('q-submit').addEventListener('click', showRecommend);
$('q-reset').addEventListener('click', ()=>{
  ['q-level','q-style','q-budget','q-strength','q-wrist','q-knee','q-gender'].forEach(id=>$(id).selectedIndex=0);
  $('q-height').value=''; $('q-weight').value=''; $('q-result').innerHTML='';
});

// ============ 初始化 ============
fillBrands();
bindTypeBtns('r-types', rFilter, applyRacketFilter);
bindTypeBtns('s-types', sFilter, applyShoeFilter);
applyRacketFilter();
applyShoeFilter();
